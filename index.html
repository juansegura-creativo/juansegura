<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cursos de Juan Segura (@creativo.juan): guiones, ganchos, videos y landing pages para negocios hispanos en EE. UU.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6a13'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='28' text-anchor='middle' fill='%23160a02'%3EJS%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cursos Juan Segura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: plataforma de cursos — barra fija, catálogo en rejilla, ficha de curso, área de miembros con reproductor + temario */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f6f1ed; --line:#ebe2db;
  --fg:#15110f; --muted:#6f655e; --accent:#ff6a13; --accent-text:#c44b06; --accent-soft:rgba(255,106,19,.10); --accent-ink:#160a02;
  --ok:#16a36a; --cover-fg:#ffffff;
  --shadow:0 1px 2px rgba(40,20,8,.05),0 10px 28px rgba(40,20,8,.07);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.05}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* Barra */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;background:none;border:0;padding:0}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
nav.links{display:flex;gap:4px;margin-left:auto}
.navbtn{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.navbtn[aria-current="true"],.navbtn:hover{color:var(--fg);background:var(--surface-2)}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,background-color .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,106,19,.35)}
.btn:active{transform:translateY(0) scale(.96)}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover::after{transform:translateX(120%)}
.btn.lg{padding:17px 32px;font-size:17px}
.btn.sm{padding:7px 15px;font-size:13px}
.arr{display:inline-block;transition:transform .25s}
.btn:hover .arr{transform:translateX(5px)}
.btn:hover .arr.down{transform:translateY(4px)}
.btn.pulse{animation:pulse 2.4s infinite}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;border-color:var(--fg);background:var(--surface-2)}
.btn.ghost::after,.btn.ghost .ripple{background:rgba(255,106,19,.18)}
.btn:disabled:hover{transform:none;box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.userchip{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}

/* Hero */
.hero{padding-block:56px 36px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end}
.hero h1{font-size:clamp(38px,6vw,68px)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:52ch;margin-top:16px;font-size:17px}
.facts{display:grid;gap:10px}
.fact{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.fact b{font-family:var(--mono);color:var(--accent-text);font-size:12px;min-width:84px}
.fact span{color:var(--muted)}

/* Catálogo */
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sechead h2{font-size:28px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left;padding:0;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.cover{aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.cover .num{font-family:var(--display);font-weight:800;font-size:72px;line-height:.8;color:var(--cover-fg);position:relative;z-index:1}
.cover .tag{position:absolute;top:12px;left:12px;z-index:1;background:rgba(13,11,10,.75);color:#fff;border-radius:999px;padding:4px 10px}
.cover .owned{position:absolute;top:12px;right:12px;z-index:1;background:var(--ok);color:#fff;border-radius:999px;padding:4px 10px}
.cv0{background:radial-gradient(circle at 85% 20%,var(--accent) 0 28%,transparent 29%),linear-gradient(135deg,#1e1915,#0d0b0a)}
.cv1{background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#1a1411 14px 34px)}
.cv2{background:linear-gradient(90deg,#0d0b0a 0 50%,var(--accent) 50%),#000}
.cv3{background:radial-gradient(circle at 20% 110%,var(--accent) 0 45%,transparent 46%),radial-gradient(circle at 90% -10%,#3a2a20 0 40%,transparent 41%),#151110}
.cv2 .num{mix-blend-mode:difference}
.cbody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3{font-size:20px}
.cbody p{color:var(--muted);font-size:14px}
.meta{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-top:auto;padding-top:8px}
.cfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 16px}
.price{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.link{color:var(--accent-text);font-weight:600;font-size:14px}

/* Ficha */
.back{background:none;border:0;color:var(--muted);padding:24px 0 12px;font-size:14px}
.detail{display:grid;grid-template-columns:1fr 360px;gap:32px;padding-bottom:64px;align-items:start}
.detail h1{font-size:clamp(32px,5vw,52px);margin-top:12px}
.lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:60ch}
.learn{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.learn div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.learn div::before{content:"→ ";color:var(--accent);font-weight:700}
.modules{margin-top:32px;display:grid;gap:10px}
.modules h2{font-size:24px;margin-bottom:6px}
details.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.mod summary{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary span:last-child{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
details.mod ul{margin:0;padding:0 16px 12px;list-style:none}
details.mod li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px;gap:12px}
details.mod li span:last-child{font-family:var(--mono);font-size:12px}
.buybox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.buybox .in{padding:20px;display:grid;gap:14px}
.buybox .price{font-size:40px}
.incl{display:grid;gap:6px;font-size:14px;color:var(--muted);padding:0;margin:0;list-style:none}
.incl li::before{content:"✓ ";color:var(--accent-text)}
.buybox{box-shadow:var(--shadow)}

/* Mis cursos */
.mine{padding-block:32px 64px}
.mine h1{font-size:clamp(30px,5vw,44px)}
.mine .sub{color:var(--muted);margin-top:8px}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center;margin-top:24px}

/* Reproductor */
.player{display:grid;grid-template-columns:1fr 340px;gap:24px;padding-bottom:64px;align-items:start}
.player > *{min-width:0}
.video{aspect-ratio:16/9;max-width:100%;background:#000;color:#fff;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;padding:20px;position:relative;overflow:hidden}
.video::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,var(--accent) var(--p,0%),#222 var(--p,0%))}
.play{width:68px;height:68px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.play::before{content:"";border-left:20px solid var(--accent-ink);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.video small{color:rgba(255,255,255,.65);display:block;margin-top:4px}
.lessonhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:18px;flex-wrap:wrap}
.lessonhead h2{font-size:24px}
.lessonhead .mono{color:var(--accent-text)}
.notes{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:14px}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.toc .top{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.toc .top b{font-family:var(--display);font-size:17px}
.toc .mh{padding:12px 16px 6px;color:var(--muted)}
.lbtn{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:10px 16px;font-size:14px}
.lbtn:hover{background:var(--surface-2)}
.lbtn[aria-current="true"]{background:var(--accent-soft)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lbtn .d{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:100%;overflow:auto;padding:24px;display:grid;gap:16px;position:relative}
.modal h2{font-size:26px}
.x{position:absolute;top:14px;right:14px;background:var(--surface-2);border:0;border-radius:50%;width:32px;height:32px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:8px;border-radius:999px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--fg)}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font:inherit;font-size:15px}
input:focus{border-color:var(--accent);outline:none}
.err{color:#c8321e;font-size:13px;min-height:1em}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note b{color:var(--accent-text)}
.summary{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px}
.summary .mini{width:64px;aspect-ratio:16/10;border-radius:8px;flex:none;padding:0}
.summary .mini .num{font-size:22px}
.summary div:last-child{min-width:0}
.rows{display:grid;gap:6px;font-size:14px}
.rows div{display:flex;justify-content:space-between}
.rows .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600;font-size:16px}
.methods{display:grid;gap:8px}
.method{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.method:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.method input{accent-color:var(--accent)}
.method span{display:grid;color:var(--fg);font-size:14px;font-weight:600}
.method small{color:var(--muted);font-weight:400}
.success{text-align:center;justify-items:center}
.check{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800}

/* Pasarela */
.steps{display:flex;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-right:40px}
.steps span{flex:1;border-top:3px solid var(--line);padding-top:6px}
.steps span.on{border-color:var(--accent);color:var(--fg)}
.gw-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gw-top > div{min-width:0}
.gw-amt{font-family:var(--display);font-weight:800;font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
.testband{background:#fff3d6;color:#7a5200;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600}
.cardvis{width:100%;max-width:320px;aspect-ratio:1.586;margin:0 auto;border-radius:14px;padding:18px;color:#fff;background:radial-gradient(circle at 100% 0,var(--accent) 0 32%,transparent 33%),linear-gradient(135deg,#2a211c,#0d0b0a);display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);box-shadow:var(--shadow)}
.cardvis .emv{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f3d27a,#c9a24a)}
.cardvis .cn{font-size:clamp(14px,4.4vw,18px);letter-spacing:.1em}
.cardvis .cr{display:flex;justify-content:space-between;gap:8px;font-size:11px;text-transform:uppercase;opacity:.85}
.field{position:relative;display:block}
.field input{width:100%;padding-right:118px}
.brands{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.brands i{font-style:normal;font-family:var(--mono);font-size:9px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{width:100%}
input[readonly]{color:var(--fg);background:var(--surface-2)}
.pp{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.pp .rows span:last-child{overflow-wrap:anywhere;text-align:right}
.gw-foot{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{padding-block:120px;display:flex;gap:10px;justify-content:center;align-items:center;color:var(--muted)}
/* Pantalla de carga */
#loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:22px;padding:24px;text-align:center;transition:opacity .45s ease,visibility .45s;perspective:600px}
#loader.out{opacity:0;visibility:hidden}
.ld-bob{animation:ldBob 1.8s ease-in-out infinite}
.ld-mark{width:88px;height:88px;border-radius:24px;background:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:36px;color:var(--accent-ink);box-shadow:0 20px 44px rgba(255,106,19,.38);transition:transform .2s ease-out;cursor:pointer;user-select:none;border:0}
.ld-mark.spin360{animation:ldSpin .7s cubic-bezier(.2,1.2,.4,1)}
.ld-funnel{display:grid;gap:7px;justify-items:center;width:220px}
.ld-funnel i{display:block;height:12px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.ld-funnel i:nth-child(1){width:100%}.ld-funnel i:nth-child(2){width:70%}.ld-funnel i:nth-child(3){width:42%}
.ld-funnel i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform:scaleX(0);transform-origin:left;animation:ldFill 2.1s cubic-bezier(.6,0,.2,1) infinite}
.ld-funnel i:nth-child(2)::after{animation-delay:.35s}.ld-funnel i:nth-child(3)::after{animation-delay:.7s}
.ld-steps{display:flex;gap:14px;color:var(--muted)}
.ld-steps span{transition:color .3s}
.ld-steps span.on{color:var(--accent-text)}
.ld-msg{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;min-height:1.4em;margin:0;transition:opacity .25s}
.ld-msg.fade{opacity:0}
.ld-hint{color:var(--muted);font-size:13px;margin:-12px 0 0}
@keyframes ldBob{50%{transform:translateY(-8px)}}
@keyframes ldSpin{from{rotate:0deg}to{rotate:360deg}}
@keyframes ldFill{0%{transform:scaleX(0)}40%,70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.ld-funnel i::after{transform:scaleX(1)}}
.linkbtn{background:none;border:0;padding:0;justify-self:center;color:var(--accent-text);font-size:13px;text-decoration:underline;cursor:pointer}
footer .legal{display:flex;gap:16px;flex-wrap:wrap}
footer .legal a{color:var(--muted)}
footer .legal a:hover{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Home: secciones de confianza */
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
a.btn{text-decoration:none}
.sec{padding-block:72px;border-top:1px solid var(--line)}
.band{background:var(--surface-2)}
.eyebrow{color:var(--accent-text);margin-bottom:12px;display:block}
.sec h2{font-size:clamp(28px,4vw,42px);max-width:24ch}
.sec .intro{color:var(--muted);font-size:17px;max-width:60ch;margin-top:12px}
.about{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:48px;align-items:start}
.photo{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);background:linear-gradient(160deg,#2a211c,#0d0b0a);position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.photo::before{content:"";position:absolute;width:75%;aspect-ratio:1;border-radius:50%;background:var(--accent);right:-22%;top:-16%}
.photo b{font-family:var(--display);font-size:96px;position:relative;line-height:1}
.photo small{position:absolute;bottom:14px;left:14px;right:14px;font-size:12px;color:rgba(255,255,255,.7);text-align:center}
.timeline{list-style:none;margin:28px 0 0;padding:0}
.timeline li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.timeline li > span{color:var(--accent-text);padding-top:3px}
.timeline b{display:block;font-size:16px}
.timeline p{color:var(--muted);font-size:14px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.tools span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface)}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.reason{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:start}
.reason .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.reason h3{font-size:20px}
.reason p{color:var(--muted);font-size:14px}
.compare{margin-top:36px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.compare .row{display:grid;grid-template-columns:1fr 1fr}
.compare .row > div{padding:14px 18px;border-top:1px solid var(--line);font-size:15px}
.compare .head > div{border-top:0;font-weight:600;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.compare .bad{color:var(--muted)}
.compare .good{background:var(--accent-soft);font-weight:500}
.compare .good::before{content:"✓ ";color:var(--accent-text);font-weight:800}
.compare .row:not(.head) .bad::before{content:"✕ ";font-weight:800}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px}
.fitcard{border-radius:var(--r);padding:26px;display:grid;gap:14px;align-content:start}
.fitcard h3{font-size:22px}
.fitcard.yes{background:var(--fg);color:#fff}
.fitcard.no{border:1px solid var(--line);background:var(--surface)}
.fitcard ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fitcard li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:15px}
.fitcard.yes li::before{content:"✓";color:var(--accent);font-weight:800}
.fitcard.no li::before{content:"✕";color:var(--muted);font-weight:800}
.fitcard.no li{color:var(--muted)}
.steps3{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;counter-reset:s}
.steps3 li{counter-increment:s;border-top:3px solid var(--accent);padding-top:16px;display:grid;gap:6px;align-content:start}
.steps3 li::before{content:"Paso " counter(s);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.steps3 b{font-family:var(--display);font-size:21px}
.steps3 p{color:var(--muted);font-size:14px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:36px}
.quote{border:1.5px dashed #d8c8bb;border-radius:var(--r);padding:22px;display:grid;gap:14px;background:var(--surface);align-content:start}
.quote .qm{font-family:var(--display);font-size:52px;line-height:.6;color:var(--accent);height:24px}
.quote p{color:var(--muted)}
.quote .who{display:flex;gap:10px;align-items:center;font-size:13px}
.quote .who i{width:36px;height:36px;border-radius:50%;background:var(--surface-2);flex:none}
.quote .who span{color:var(--muted);display:block}
.guar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:32px;background:var(--surface);box-shadow:var(--shadow)}
.seal{width:120px;height:120px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:800;line-height:1;outline:2px dashed var(--accent);outline-offset:6px;margin:8px}
.seal b{font-size:44px;display:block}
.seal small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.guar h3{font-size:26px}
.guar p{color:var(--muted);margin-top:8px;max-width:62ch}
.guar .edit{display:inline-block;margin-top:12px;font-size:12px;color:var(--accent-text)}
.faq{display:grid;gap:10px;margin-top:32px;max-width:820px}
.faq details.mod summary span:last-child{font-size:20px;line-height:1;color:var(--accent-text)}
.faq details.mod[open] summary span:last-child{transform:rotate(45deg)}
.faq details.mod p{padding:0 16px 16px;color:var(--muted)}
.final{background:var(--fg);color:#fff;border-radius:22px;padding:48px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden;margin-block:72px}
.final::after{content:"";position:absolute;width:300px;aspect-ratio:1;border-radius:50%;background:var(--accent);left:-140px;bottom:-210px}
.final > *{position:relative;z-index:1}
.final h2{font-size:clamp(28px,4vw,44px);max-width:20ch}
.final p{color:rgba(255,255,255,.72);margin-top:10px;max-width:50ch}
.final .acts{display:flex;gap:10px;flex-wrap:wrap}
.final .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3)}
.handle{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.72);margin-top:14px;user-select:all}
@media (max-width:860px){
  .about,.fit,.final,.guar{grid-template-columns:1fr}
  .steps3{grid-template-columns:1fr}
  .photo{max-width:300px}
}
@media (max-width:560px){
  .sec{padding-block:52px}
  .timeline li{grid-template-columns:1fr;gap:4px}
  .compare .row{grid-template-columns:1fr}
  .compare .head{display:none}
  .compare .row:not(.head) .good{border-top:0}
  .final{padding:36px 22px}
}
@media (max-width:860px){
  .hero,.detail,.player{grid-template-columns:1fr}
  .buybox,.toc{position:static}
  .learn{grid-template-columns:1fr}
}
@media (max-width:560px){
  .navbtn.hide-s{display:none}
  .logo span{display:none}
  .hero{padding-block:32px 24px}
}
/* ---------- Animaciones ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,19,.5)}70%{box-shadow:0 0 0 16px rgba(255,106,19,0)}100%{box-shadow:0 0 0 0 rgba(255,106,19,0)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes ul{to{background-size:100% .32em}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes float{50%{transform:translate(-16px,14px) scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.15)}}
@keyframes wiggle{30%{transform:rotate(-12deg) scale(1.12)}60%{transform:rotate(8deg) scale(1.12)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes fade{from{opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes stripes{to{background-position:48px 0}}
@keyframes reveal{from{opacity:.3;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

/* Hero: entrada escalonada + resaltado */
.hero > div:first-child > *{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero > div:first-child > :nth-child(2){animation-delay:.08s}
.hero > div:first-child > :nth-child(3){animation-delay:.16s}
.hero > div:first-child > :nth-child(4){animation-delay:.24s}
.fact{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.fact:nth-child(1){animation-delay:.32s}.fact:nth-child(2){animation-delay:.4s}.fact:nth-child(3){animation-delay:.48s}
.hero h1 em{color:var(--fg);background:linear-gradient(var(--accent),var(--accent)) 0 88%/0% .32em no-repeat;animation:ul .7s .6s cubic-bezier(.2,.8,.2,1) forwards}
.calm .hero > div:first-child > *,.calm .fact{animation:none}
.calm .hero h1 em{animation:none;background-size:100% .32em}

/* Cinta de palabras */
.marquee{background:var(--fg);color:#fff;overflow:hidden;padding-block:14px;margin-bottom:36px}
.mq{display:flex;width:max-content;animation:mq 32s linear infinite;font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.mq > *{padding-right:26px}
.mq i{color:var(--accent);font-style:normal}
.marquee:hover .mq{animation-play-state:paused}

/* Tarjetas de curso */
.grid .card{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 80ms)}
.card{transition:border-color .2s,translate .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{translate:0 -5px;box-shadow:0 20px 44px rgba(40,20,8,.13)}
.cover .num{transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.card:hover .cover .num{transform:translateY(-8px) scale(1.08)}
.card:hover .cv1{animation:stripes 1s linear infinite}
.card .link{transition:transform .25s}
.card:hover .link{transform:translateX(5px)}
.logo i{transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.logo:hover i{transform:rotate(-10deg) scale(1.1)}
.chip{transition:all .2s}
.chip:hover{border-color:var(--accent);color:var(--fg)}

/* Secciones */
.reason{transition:translate .3s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .3s}
.reason:hover{translate:0 -5px;border-color:var(--accent);box-shadow:var(--shadow)}
.reason:hover .ic{animation:wiggle .5s}
.photo::before{animation:float 7s ease-in-out infinite}
.seal{position:relative;outline:0}
.seal::after{content:"";position:absolute;inset:-10px;border:2px dashed var(--accent);border-radius:50%;animation:spin 16s linear infinite}
.final::after{animation:breathe 6s ease-in-out infinite}
.final .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.mod[open] > :not(summary){animation:rise .35s both}
.lbtn{transition:background-color .2s,padding-left .2s}
.lbtn:hover{padding-left:20px}
.scrim{animation:fade .2s both}
.modal{animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
.check{animation:pop .6s cubic-bezier(.2,1.8,.4,1) both}
.toast{animation:toastIn .3s cubic-bezier(.2,1.3,.4,1)}
@supports (animation-timeline: view()){
  .sec h2,.reason,.compare .row,.fitcard,.steps3 li,.quote,.guar,.faq details,.final,.timeline li,.photo{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
}

/* Menos espacio en blanco */
.hero{padding-block:40px 30px;align-items:center}
.sec{padding-block:52px}
.grid{padding-bottom:44px}
.reasons,.compare,.fit,.steps3,.quotes{margin-top:24px}
.faq{margin-top:22px}
.about{gap:36px}
.timeline{margin-top:18px}
.final{margin-block:44px 52px;padding:40px 32px}
.detail,.player{padding-bottom:44px}
.mine{padding-block:28px 48px}
@media (max-width:560px){
  .sec{padding-block:38px}
  .hero{padding-block:28px 20px}
  .final{padding:30px 20px}
  .marquee{margin-bottom:24px}
  .mq{font-size:17px}
  .btn.lg{padding:15px 26px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .hero h1 em{background-size:100% .32em}
}
</style>
</head>
<body>


<header class="bar">
  <div class="wrap">
    <button class="logo" id="logo" aria-label="Ir al inicio"><i>JS</i><span>Juan Segura</span></button>
    <nav class="links">
      <button class="navbtn hide-s" id="nav-cursos">Cursos</button>
      <button class="navbtn" id="nav-mis">Mis cursos</button>
    </nav>
    <div id="authslot"></div>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap"><span>© 2026 Juan Segura · @creativo.juan</span><span class="legal"><a href="/terminos.html">Términos</a><a href="/privacidad.html">Privacidad</a><a href="/reembolsos.html">Reembolsos</a></span></div></footer>

<div id="loader" role="status" aria-live="polite">
  <div class="ld-bob"><button class="ld-mark" id="ld-mark" type="button" aria-label="Juan Segura">JS</button></div>
  <div class="ld-funnel" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="ld-msg" id="ld-msg">Preparando tus cursos…</p>
  <p class="ld-hint" id="ld-hint">Toca el logo mientras esperas</p>
  <button class="btn sm" id="ld-retry" type="button" hidden>Reintentar</button>
</div>
<div id="modalroot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>
<script>
/* ---------- Conexión a Supabase ---------- */
const SUPABASE_URL='https://izjfqfputahsmvfvgkos.supabase.co';
const SUPABASE_KEY='sb_publishable_afMpViRqXd32KXNNIRIOnA_1sTZwO-d';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ---------- Datos (vienen de la base de datos) ---------- */
let COURSES = [];
const LEARN = ['Resultado 1 que obtiene el alumno','Resultado 2 que obtiene el alumno','Resultado 3 que obtiene el alumno','Resultado 4 que obtiene el alumno'];
let S = { user:null, owned:new Set(), done:new Set(), filter:'Todos', loadError:false };
let booted=false, recovery=false;

async function loadCourses(){
  const {data,error}=await sb.from('cursos')
    .select('id,numero,categoria,titulo,descripcion,precio_usd,nivel,orden,ls_checkout_url,modulos(id,titulo,orden,lecciones(id,titulo,duracion,descripcion,orden))')
    .order('orden');
  if(error){ console.error(error); S.loadError=true; return; }
  const byOrden=(a,b)=>a.orden-b.orden;
  COURSES=data.map(c=>({
    id:c.id, n:c.numero||'', cat:c.categoria||'', title:c.titulo, sub:c.descripcion||'',
    price:Number(c.precio_usd)||0, level:c.nivel||'', checkout:c.ls_checkout_url||'',
    modules:(c.modulos||[]).sort(byOrden).map(m=>({id:m.id, t:m.titulo,
      lessons:(m.lecciones||[]).sort(byOrden).map(l=>({id:String(l.id), t:l.titulo, d:l.duracion||'', desc:l.descripcion||''}))}))
  }));
}
async function loadUserData(){
  if(!S.user){ S.owned=new Set(); S.done=new Set(); return; }
  const [c,p]=await Promise.all([
    sb.from('compras').select('curso_id').eq('estado','pagado'),
    sb.from('progreso').select('leccion_id')
  ]);
  S.owned=new Set((c.data||[]).map(r=>r.curso_id));
  S.done=new Set((p.data||[]).map(r=>String(r.leccion_id)));
}
function setUser(u){
  S.user = u ? {id:u.id, email:u.email, name:(u.user_metadata&&u.user_metadata.nombre)||u.email.split('@')[0]} : null;
}
function authError(e){
  const m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/email not confirmed/i.test(m)) return 'Aún no confirmas tu correo. Busca el enlace en tu bandeja de entrada (o en spam).';
  if(/already registered|already been registered/i.test(m)) return 'Ya existe una cuenta con ese correo. Entra en la pestaña "Entrar".';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos seguidos. Espera unos minutos y vuelve a intentar.';
  if(/password/i.test(m)) return 'La contraseña no es válida. Usa al menos 6 caracteres.';
  return 'No pudimos completar la acción. Revisa tu conexión e intenta de nuevo.';
}

/* ---------- Utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = id=>COURSES.find(c=>c.id===id);
const user = ()=>S.user;
const owned = id=>!!S.user && S.owned.has(id);
const totalLessons = c=>c.modules.reduce((a,m)=>a+m.lessons.length,0);
const totalMin = c=>c.modules.reduce((a,m)=>a+m.lessons.reduce((b,l)=>b+(parseInt(l.d)||0),0),0);
const fmtPrice = p=>p===0?'Gratis':`$${p}`;
const lessonIds = c=>c.modules.flatMap(m=>m.lessons.map(l=>l.id));
const doneList = id=>{const c=byId(id); return c?lessonIds(c).filter(k=>S.done.has(k)):[]};
const pct = c=>{const t=totalLessons(c); return t?Math.round(doneList(c.id).length/t*100):0};
const coverIdx = c=>(((parseInt(c.n)||COURSES.indexOf(c)+1)-1)%4+4)%4;
const cover = (c,extra='')=>`<div class="cover cv${coverIdx(c)} ${extra}"><span class="tag mono">${esc(c.cat)}</span>${owned(c.id)?'<span class="owned mono">Tuyo</span>':''}<span class="num">${esc(c.n)}</span></div>`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}

/* ---------- Rutas por hash ---------- */
let pendingBuy = null;
let currentLesson = {};
function go(h){ if(location.hash==='#'+h) render(); else location.hash=h; window.scrollTo(0,0); }
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

function render(){
  const h = location.hash.slice(1);
  renderAuth();
  $('#nav-cursos').setAttribute('aria-current', String(!h || h==='cursos' || h.startsWith('curso-')));
  $('#nav-mis').setAttribute('aria-current', String(h==='mis-cursos' || h.startsWith('aprender-')));
  if(h==='mis-cursos') return renderMine();
  if(h.startsWith('aprender-')) return renderPlayer(h.replace('aprender-',''));
  if(h.startsWith('curso-') && byId(h)) return renderDetail(byId(h));
  renderCatalog();
}

function renderAuth(){
  const u=user();
  $('#authslot').innerHTML = u
    ? `<button class="userchip" id="userbtn" aria-label="Cerrar sesión de ${esc(u.name)}"><span class="avatar">${esc(u.name.trim()[0]||'?').toUpperCase()}</span></button>`
    : `<button class="btn sm" id="loginbtn">Entrar</button>`;
  if(u) $('#userbtn').onclick=()=>openAccount();
  else $('#loginbtn').onclick=()=>openLogin();
}

/* ---------- Catálogo ---------- */
const ic = p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function renderCatalog(){
  const cats=['Todos',...new Set(COURSES.map(c=>c.cat))];
  const list=COURSES.filter(c=>S.filter==='Todos'||c.cat===S.filter);
  $('#app').innerHTML=`
  <section class="wrap hero">
    <div>
      <p class="mono" style="color:var(--accent-text);margin-bottom:14px">Cursos de @creativo.juan</p>
      <h1>Aprende lo que yo <em>aplico</em> con negocios hispanos en EE. UU.</h1>
      <p>Lo que hacía como Director Creativo en una agencia de EE. UU., convertido en cursos: guiones de video, ganchos, VSL y landing pages para negocios de servicios.</p>
      <div class="hero-cta"><button class="btn lg pulse" id="h-ver">Ver los cursos <span class="arr down">↓</span></button><button class="btn ghost" id="h-free">Empezar con la clase gratis</button></div>
    </div>
    <div class="facts">
      <div class="fact"><b>Acceso</b><span>Inmediato después del pago</span></div>
      <div class="fact"><b>Pago</b><span>Tarjetas internacionales y PayPal, en USD</span></div>
      <div class="fact"><b>Formato</b><span>Clases en video, por módulos</span></div>
    </div>
  </section>
  <div class="marquee" aria-hidden="true"><div class="mq">${Array(2).fill(['Ganchos','Guiones','VSL','Landing pages','Edición de video','Posicionamiento','Negocios hispanos en EE. UU.'].map(w=>`<span>${w}</span><i>✦</i>`).join('')).join('')}</div></div>
  <section class="wrap" id="cursos">
    <div class="sechead">
      <h2>Cursos disponibles</h2>
      <div class="filters">${cats.map(c=>`<button class="chip" data-f="${esc(c)}" aria-pressed="${S.filter===c}">${esc(c)}</button>`).join('')}</div>
    </div>
    <div class="grid">
      ${list.map((c,i)=>`
        <button class="card" data-open="${c.id}" style="--i:${i}">
          ${cover(c)}
          <div class="cbody">
            <h3>${esc(c.title)}</h3>
            <p>${esc(c.sub)}</p>
            <div class="meta"><span>${c.modules.length} módulos</span><span>${totalLessons(c)} clases</span><span>${c.level}</span></div>
          </div>

/* ---------- Reproductor ---------- */
function renderPlayer(id){
  const c=byId(id);
  if(!c||!owned(id)) return c?renderDetail(c):renderCatalog();
  const flat=[]; c.modules.forEach((m,mi)=>m.lessons.forEach(l=>flat.push({...l,key:l.id,m:mi})));
  if(!flat.length){ $('#app').innerHTML=`<div class="wrap mine"><h1>${esc(c.title)}</h1><div class="empty"><p>Este curso todavía no tiene clases.</p></div></div>`; return; }
  const done=doneList(id);
  let cur = currentLesson[id] || (flat.find(l=>!done.includes(l.key))||flat[0]).key;
  currentLesson[id]=cur;
  const idx=flat.findIndex(l=>l.key===cur), L=flat[idx], isDone=done.includes(cur);
  $('#app').innerHTML=`
  <div class="wrap">
    <button class="back" id="back">← Mis cursos</button>
    <div class="player">
      <div>
        <div class="video" style="--p:${isDone?100:0}%">
          <div><div class="play" aria-hidden="true"></div><b>${esc(L.t)}</b><small>Aquí va tu video (Vimeo, Bunny Stream o similar)</small></div>
        </div>
        <div class="lessonhead">
          <div><span class="mono">${esc(c.modules[L.m].t)} · Clase ${idx+1} de ${flat.length}</span><h2 style="margin-top:6px">${esc(L.t)}</h2></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn ghost" id="mark">${isDone?'✓ Completada':'Marcar como completada'}</button>
            ${idx<flat.length-1?'<button class="btn" id="next">Siguiente clase →</button>':''}
          </div>
        </div>
        <div class="notes">${L.desc?esc(L.desc):'Descripción de la clase, recursos y enlaces de descarga. Reemplaza este texto con el material de cada lección.'}</div>
      </div>
      <aside class="toc">
        <div class="top"><b>${esc(c.title)}</b><div class="prog"><i style="width:${pct(c)}%"></i></div><span class="mono" style="color:var(--muted)">${pct(c)}% · ${done.length}/${flat.length} clases</span></div>
        ${c.modules.map((m,mi)=>`<div class="mh mono">${esc(m.t)}</div>${flat.filter(l=>l.m===mi).map(l=>`
          <button class="lbtn" data-k="${l.key}" aria-current="${l.key===cur}"><span class="dot ${done.includes(l.key)?'done':''}">${done.includes(l.key)?'✓':''}</span>${esc(l.t)}<span class="d">${l.d}</span></button>`).join('')}`).join('')}
      </aside>
    </div>
  </div>`;
  $('#back').onclick=()=>go('mis-cursos');
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{currentLesson[id]=b.dataset.k;renderPlayer(id)});
  $('#mark').onclick=async()=>{
    const b=$('#mark'); b.disabled=true;
    if(S.done.has(cur)){
      const {error}=await sb.from('progreso').delete().eq('leccion_id',Number(cur));
      if(error) toast('No se pudo guardar. Intenta de nuevo.'); else S.done.delete(cur);
    } else {
      const {error}=await sb.from('progreso').insert({usuario_id:S.user.id, leccion_id:Number(cur)});
      if(error && error.code!=='23505') toast('No se pudo guardar. Intenta de nuevo.');
      else { S.done.add(cur); toast(pct(c)===100?'¡Terminaste el curso!':'Clase completada'); }
    }
    renderPlayer(id);
  };
  sb.from('lecciones_video').select('video_url').eq('leccion_id',Number(cur)).maybeSingle().then(({data})=>{
    const v=$('.video');
    if(v && data && data.video_url && currentLesson[id]===cur)
      v.innerHTML=`<iframe src="${esc(data.video_url)}" title="${esc(L.t)}" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>`;
  });
  const nx=$('#next'); if(nx) nx.onclick=()=>{currentLesson[id]=flat[idx+1].key;renderPlayer(id);window.scrollTo(0,0)};
}

function modal(html){

  $('#x').onclick=closeModal;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeModal()};
  const f=$('#modalroot input'); if(f) f.focus();
}
function closeModal(){$('#modalroot').innerHTML='';pendingBuy=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scrim'))closeModal()});

function openLogin(msg, mode='login'){
  modal(`
    <h2>${mode==='login'?'Entra a tu cuenta':'Crea tu cuenta'}</h2>
    ${msg?`<p style="color:var(--muted)">${esc(msg)}</p>`:''}
    <div class="tabs" role="tablist">
      <button role="tab" id="t-login" aria-selected="${mode==='login'}">Entrar</button>
      <button role="tab" id="t-reg" aria-selected="${mode==='reg'}">Crear cuenta</button>
    </div>
    <form id="authform" style="display:grid;gap:12px" novalidate>
      ${mode==='reg'?'<label for="f-name">Nombre<input type="text" id="f-name" autocomplete="name" placeholder="Tu nombre"></label>':''}
      <label for="f-email">Correo<input type="email" id="f-email" autocomplete="email" placeholder="tu@correo.com"></label>
      <label for="f-pass">Contraseña<input type="password" id="f-pass" autocomplete="${mode==='reg'?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres"></label>
      <p class="err" id="f-err"></p>
      <button class="btn block" type="submit" id="f-submit">${mode==='login'?'Entrar':'Crear cuenta'}</button>
      ${mode==='login'?'<button type="button" class="linkbtn" id="forgot">¿Olvidaste tu contraseña?</button>':''}
    </form>`);
  const keep=pendingBuy;
  $('#t-login').onclick=()=>{openLogin(msg,'login');pendingBuy=keep};
  $('#t-reg').onclick=()=>{openLogin(msg,'reg');pendingBuy=keep};
  pendingBuy=keep;
  const fg=$('#forgot');
  if(fg) fg.onclick=async()=>{
    const email=$('#f-email').value.trim().toLowerCase(), err=$('#f-err');
    if(!/^\S+@\S+\.\S+$/.test(email)) return err.textContent='Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".';
    fg.disabled=true;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
    fg.disabled=false;
    if(error) return err.textContent=authError(error);
    modal(`<div class="success" style="display:grid;gap:14px"><div class="check">✓</div><h2>Revisa tu correo</h2><p style="color:var(--muted)">Si existe una cuenta con <b>${esc(email)}</b>, te llegará un enlace para crear una contraseña nueva.</p></div><button class="btn block" id="okmail">Entendido</button>`);
    $('#okmail').onclick=closeModal;
  };
  $('#authform').onsubmit=async e=>{
    e.preventDefault();
    const email=$('#f-email').value.trim().toLowerCase(), pass=$('#f-pass').value, err=$('#f-err');
    err.textContent='';
    if(!/^\S+@\S+\.\S+$/.test(email)) return err.textContent='Escribe un correo válido.';
    if(pass.length<6) return err.textContent='La contraseña debe tener al menos 6 caracteres.';
    let name='';
    if(mode==='reg'){ name=$('#f-name').value.trim(); if(!name) return err.textContent='Escribe tu nombre.'; }
    const btn=$('#f-submit'), label=btn.textContent;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> Un momento…';
    const res = mode==='reg'
      ? await sb.auth.signUp({email, password:pass, options:{data:{nombre:name}, emailRedirectTo:location.origin}})
      : await sb.auth.signInWithPassword({email, password:pass});
    btn.disabled=false; btn.textContent=label;
    if(res.error) return err.textContent=authError(res.error);
    if(mode==='reg' && res.data.user && res.data.user.identities && res.data.user.identities.length===0)
      return err.textContent='Ya existe una cuenta con ese correo. Entra en la pestaña "Entrar".';
    if(mode==='reg' && !res.data.session){
      modal(`<div class="success" style="display:grid;gap:14px"><div class="check">✉</div><h2>Revisa tu correo</h2><p style="color:var(--muted)">Te enviamos un enlace a <b>${esc(email)}</b> para activar tu cuenta. Al hacer clic vuelves aquí con tu sesión iniciada. Si no lo ves, busca en spam.</p></div><button class="btn block" id="okmail">Entendido</button>`);
      $('#okmail').onclick=closeModal; return;
    }
    setUser(res.data.user); await loadUserData();
    const next=pendingBuy; closeModal(); render();
    toast(mode==='reg'?'Cuenta creada':'Sesión iniciada');
    if(next){ owned(next)?go('aprender-'+next):openCheckout(byId(next)); }
  };
}

      <p class="err" id="np-err"></p>
      <button class="btn block" type="submit" id="np-btn">Guardar contraseña</button>
    </form>`);
  $('#npform').onsubmit=async e=>{
    e.preventDefault();
    const pass=$('#np-pass').value, err=$('#np-err');
    if(pass.length<6) return err.textContent='La contraseña debe tener al menos 6 caracteres.';
    $('#np-btn').disabled=true;

    closeModal(); toast('Contraseña actualizada');
  };
}

function openAccount(){
  const u=user();
  modal(`
    <h2>${esc(u.name)}</h2>
    <p style="color:var(--muted)">${esc(u.email)}</p>
    <button class="btn block" id="a-mis">Mis cursos</button>
    <button class="btn ghost block" id="a-out">Cerrar sesión</button>`);
  $('#a-mis').onclick=()=>{closeModal();go('mis-cursos')};
  $('#a-out').onclick=async()=>{await sb.auth.signOut(); setUser(null); S.owned=new Set(); S.done=new Set(); closeModal(); go('cursos'); toast('Sesión cerrada')};
}

function openCheckout(c){
  const free=c.price===0, ready=free||!!c.checkout;
  modal(`
    <h2>${free?'Inscripción':'Finalizar compra'}</h2>
    <div class="summary">${cover(c,'mini')}<div><b>${esc(c.title)}</b><p style="color:var(--muted);font-size:13px">${totalLessons(c)} clases · acceso inmediato</p></div></div>
    <div class="rows">
      <div><span>Precio</span><span>${fmtPrice(c.price)}${c.price?' USD':''}</span></div>
      <div class="tot"><span>Total</span><span>${fmtPrice(c.price)}${c.price?' USD':''}</span></div>
    </div>
    ${free?'':`<p class="note">${LOCK} Pago seguro con <b>Lemon Squeezy</b>. Aceptamos tarjetas de cualquier país y PayPal. Según tu país se pueden sumar impuestos locales, que verás antes de pagar.</p>`}
    <button class="btn lg block" id="pay" ${ready?'':'disabled'}>${free?'Inscribirme gratis':ready?`Pagar ${fmtPrice(c.price)} USD →`:'Muy pronto a la venta'}</button>
    ${free?'':'<p style="font-size:12px;color:var(--muted);text-align:center;margin:0">Al pagar aceptas los <a href="/terminos.html" target="_blank" style="color:inherit">Términos</a> y la <a href="/reembolsos.html" target="_blank" style="color:inherit">Política de reembolso</a>.</p>'}`);
  if(!ready) return;
  $('#pay').onclick=()=>{
    $('#pay').disabled=true;
    if(free) return setTimeout(()=>enrollFree(c),300);
    closeModal(); startPayment(c);
  };
}

const LOCK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="vertical-align:-2px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ---------- Pago con Lemon Squeezy ---------- */
function checkoutUrl(c, embed){
  const q=[
    ['checkout[email]', S.user.email],
    ['checkout[name]', S.user.name],
    ['checkout[custom][user_id]', S.user.id],
    ['embed', embed?'1':'0'], ['media','0'], ['logo','0'], ['desc','0'],
  ].map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  return c.checkout+(c.checkout.includes('?')?'&':'?')+q;
}
let lemonSetup=false;
function startPayment(c){
  const ls=window.LemonSqueezy;
  if(window.createLemonSqueezy && (ls || window.createLemonSqueezy)){
    try{
      if(!lemonSetup){ window.createLemonSqueezy(); lemonSetup=true; }
      window.LemonSqueezy.Setup({eventHandler:e=>{ if(e&&e.event==='Checkout.Success'){ setTimeout(()=>{ try{ window.LemonSqueezy.Url.Close(); }catch(_){} waitForAccess(c); },1200); } }});
      window.LemonSqueezy.Url.Open(checkoutUrl(c,true));
      return;
    }catch(err){ console.error(err); }
  }
  location.href=checkoutUrl(c,false);   // si el pago embebido no carga, abre la página de pago normal
}
async function waitForAccess(c){
  if(owned(c.id)) return successModal(c);
  modal(`<div class="success" style="display:grid;gap:14px"><span class="spin" style="width:28px;height:28px"></span><h2>Confirmando tu pago…</h2><p style="color:var(--muted)">Esto toma unos segundos. No cierres esta página.</p></div>`);
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r,2500));
    const {data}=await sb.from('compras').select('curso_id').eq('curso_id',c.id).eq('estado','pagado').maybeSingle();
    if(data){ S.owned.add(c.id); render(); return successModal(c); }
  }
  modal(`<h2>Tu pago está en proceso</h2><p style="color:var(--muted)">Lemon Squeezy ya recibió tu pago y te envió el recibo por correo. El acceso puede tardar unos minutos en activarse: entra a <b>Mis cursos</b> en un rato. Si en 10 minutos no lo ves, escríbeme por Instagram a @creativo.juan.</p><button class="btn block" id="okw">Entendido</button>`);
  $('#okw').onclick=()=>{closeModal();go('mis-cursos')};
}
function successModal(c){
  modal(`
    <div class="success" style="display:grid;gap:14px">
      <div class="check">✓</div><h2>¡Listo, ya es tuyo!</h2>
      <p style="color:var(--muted)">${esc(c.title)} ya está en Mis cursos.</p>
    </div>
    <button class="btn lg block" id="startc">Empezar el curso</button>`);
  $('#startc').onclick=()=>{closeModal();go('aprender-'+c.id)};
}
async function enrollFree(c){
  const {error}=await sb.from('compras').insert({usuario_id:S.user.id, curso_id:c.id, monto_usd:0, metodo:'gratis'});
  if(error && error.code!=='23505'){
    console.error(error);
    modal(`<h2>No se pudo completar</h2><p style="color:var(--muted)">Hubo un problema guardando tu inscripción. Intenta de nuevo.</p><button class="btn block" id="retry">Volver a intentar</button>`);
    $('#retry').onclick=()=>openCheckout(c); return;
  }
  S.owned.add(c.id); render(); successModal(c);
}

/* ---------- Arranque ---------- */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn'); if(!b||b.disabled) return;
  const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height), sp=document.createElement('span');
  sp.className='ripple'; sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(sp); setTimeout(()=>sp.remove(),650);
});
$('#logo').onclick=()=>{document.documentElement.classList.remove('calm');go('cursos')};
$('#nav-cursos').onclick=()=>go('cursos');
$('#nav-mis').onclick=()=>go('mis-cursos');

if(sb){
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY') recovery=true;
    if(!booted || event==='INITIAL_SESSION' || event==='TOKEN_REFRESHED') return;
    setTimeout(async()=>{
      setUser(session?session.user:null);
      await loadUserData();
      render();
      if(recovery){ recovery=false; openNewPassword(); }
    },0);
  });
}
/* ---------- Pantalla de carga ---------- */
const loader=(()=>{
  const el=$('#loader'), mark=$('#ld-mark'), msg=$('#ld-msg'), steps=[...document.querySelectorAll('.ld-steps span')];
  const lines=['Preparando tus cursos…','Revisando tu sesión…','Cargando tus clases…','Ya casi…'];
  const fun=['¡Eso! Sigue así','Ganchos cargando…','Directo al grano','Una vez más'];
  let i=0, taps=0, t0=performance.now();
  const say=txt=>{msg.classList.add('fade');setTimeout(()=>{msg.textContent=txt;msg.classList.remove('fade')},220)};
  const tick=setInterval(()=>{i=(i+1)%lines.length; say(lines[i]); steps.forEach((s,k)=>s.classList.toggle('on',k===i%3));},1500);
  el.addEventListener('pointermove',e=>{
    const r=mark.getBoundingClientRect(), dx=(e.clientX-(r.left+r.width/2))/r.width, dy=(e.clientY-(r.top+r.height/2))/r.height;
    mark.style.transform=`rotateY(${Math.max(-25,Math.min(25,dx*14))}deg) rotateX(${Math.max(-25,Math.min(25,-dy*14))}deg)`;
  });
  el.addEventListener('pointerleave',()=>mark.style.transform='');
  mark.addEventListener('click',()=>{
    mark.classList.remove('spin360'); void mark.offsetWidth; mark.classList.add('spin360');
    say(fun[taps++%fun.length]);
  });
  return {
    async hide(){
      const wait=Math.max(0,700-(performance.now()-t0));
      await new Promise(r=>setTimeout(r,wait));
      clearInterval(tick); el.classList.add('out'); setTimeout(()=>el.remove(),500);
    },
    fail(text){
      clearInterval(tick); msg.textContent=text; $('#ld-hint').hidden=true;
      document.querySelector('.ld-funnel').style.opacity='.35';
      const b=$('#ld-retry'); b.hidden=false; b.onclick=()=>location.reload();
    }
  };
})();

async function boot(){
  if(!sb){ loader.fail('No pudimos conectar. Revisa tu internet.'); return; }
  const [{data}] = await Promise.all([sb.auth.getSession(), loadCourses()]);
  setUser(data && data.session ? data.session.user : null);
  await loadUserData();
  booted=true;
  render();
  loader.hide();
  setTimeout(()=>document.documentElement.classList.add('calm'),1600);
  if(recovery){ recovery=false; openNewPassword(); }
}
boot();
</script>
